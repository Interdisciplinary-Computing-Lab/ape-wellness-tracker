services:
  - type: web
    name: ape-wellness-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python misc/scripts/import_fdc_foundation.py --import-all && python misc/scripts/prune_non_fdc_foods.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true
      - key: EXPORT_HASH_SALT
        generateValue: true
    disk:
      name: instance-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
