{% extends "base.html" %}

{% block body %}
<div class="container mt-4">
  <h2>Edit Meal</h2>
  <form method="post">
    <div class="mb-3">
      <label for="ape_id" class="form-label">Ape ID</label>
      <input type="number" class="form-control" name="ape_id" id="ape_id" value="{{ meal.ape_id }}" required>
    </div>
    <div class="mb-3">
      <label for="recipe_id" class="form-label">Recipe ID</label>
      <input type="number" class="form-control" name="recipe_id" id="recipe_id" value="{{ meal.recipe_id }}" required>
    </div>
    <div class="mb-3">
      <label for="date" class="form-label">Date</label>
      <input type="date" class="form-control" name="date" id="date" value="{{ meal.date.strftime('%Y-%m-%d') }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('site.index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
