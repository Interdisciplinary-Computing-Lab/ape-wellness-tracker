{% extends "base.html" %}

{% block body %}
<div class="container mt-4">
  <h2>Edit Recipe</h2>
  <form method="post">
    <div class="mb-3">
      <label for="meal_name" class="form-label">Recipe Name</label>
      <input type="text" class="form-control" name="meal_name" id="meal_name" value="{{ recipe.meal_name }}" required>
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <input type="text" class="form-control" name="description" id="description" value="{{ recipe.description }}">
    </div>
    <div class="mb-3">
      <label for="calories" class="form-label">Calories</label>
      <input type="number" class="form-control" name="calories" id="calories" value="{{ recipe.calories }}" min="0" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('site.index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
