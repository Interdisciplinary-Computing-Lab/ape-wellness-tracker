{% extends 'adminlte_base.html' %}
{% block title %}All Apes - Ape Wellness Tracker{% endblock %}
{% block page_title %}All Apes{% endblock %}
{% block body %}
<div class="container-fluid">
  <div class="row">
    {% for ape in apes %}
    <div class="col-md-4 col-lg-3 mb-4 d-flex align-items-stretch">
      <div class="card w-100 text-center">
        <a href="{{ url_for('site.ape_profile_page', ape_id=ape.id) }}">
          <img src="{{ url_for('static', filename='images/' + ape.ape_name|lower + '.jpg') }}" class="card-img-top" alt="{{ ape.ape_name }}" style="object-fit: cover; height: 250px;">
        </a>
        <div class="card-body">
          <h5 class="card-title mb-0">{{ ape.ape_name }}</h5>
          <p class="text-muted">Age: {{ ape.age }}</p>
          <a href="{{ url_for('site.ape_profile_page', ape_id=ape.id) }}" class="btn btn-primary btn-sm mt-2">View Profile</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
